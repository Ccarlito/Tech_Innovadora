name: CD - Innovatech Chile

on:
  push:
    branches:
      - release/0.1.0

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push - Backend Ventas
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-backend-ventas:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-backend-ventas:latest

      - name: Build y Push - Backend Despachos
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-backend-despachos:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-backend-despachos:latest

      - name: Build y Push - Frontend
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-frontend:latest \
            ./front_despacho
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-chile-frontend:latest

      - name: Deploy en EC2 Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login ECR como ec2-user y root
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            aws ecr get-login-password --region us-east-1 | \
              sudo docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Crear .env con valores reales en la EC2
            cat > /home/ec2-user/app/.env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
            MYSQL_DATABASE=innova_tech_db
            AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            ENVEOF

            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/innovatech-chile-backend-ventas:latest
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/innovatech-chile-backend-despachos:latest

            cd /home/ec2-user/app
            sudo -E docker-compose up -d --no-deps --pull always backend-ventas backend-despacho

      - name: Deploy en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            aws ecr get-login-password --region us-east-1 | \
              sudo docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Crear .env con valores reales en la EC2 frontend
            cat > /home/ec2-user/app/.env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
            MYSQL_DATABASE=innova_tech_db
            AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            ENVEOF

            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/innovatech-chile-frontend:latest

            cd /home/ec2-user/app
            sudo -E docker-compose up -d --no-deps --pull always frontend